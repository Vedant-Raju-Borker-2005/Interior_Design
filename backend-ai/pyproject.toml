[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ids"
version = "0.1.0"
description = "Automated Interior Design System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
solver = [
    "ortools>=9.7.0",
]
serve = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
ids = "ids.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ids*"]
